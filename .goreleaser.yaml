version: 2

project_name: mondspace-reviewer

builds:
  - id: mondspace-reviewer
    main: ./cmd/mondspace-reviewer
    binary: mondspace-reviewer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # Stamp the version so `msr version` reports the release rather than
      # falling back to the module's build info.
      - -s -w -X main.version={{ .Version }}

archives:
  - id: mondspace-reviewer
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^docs:"

# Homebrew, published to mondial7/homebrew-tap:
#
#   brew install mondial7/tap/mondspace-reviewer
#
# A cask rather than a formula: GoReleaser has deprecated `brews`, and Homebrew
# now takes casks for binaries too. Casks are a macOS mechanism, so the tarballs
# and `go install` remain the route on Linux.
#
# The default GITHUB_TOKEN cannot write to another repository, so publishing
# needs a personal access token with `contents: write` on the tap, exposed to
# the release workflow as HOMEBREW_TAP_TOKEN. Absent that secret the cask is
# skipped rather than failing the release: a missing tap must not stop the
# binaries from shipping.
homebrew_casks:
  - name: mondspace-reviewer
    ids: [mondspace-reviewer]
    repository:
      owner: mondial7
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Casks
    homepage: https://github.com/mondial7/mondspace-reviewer
    description: A review companion for autonomous coding agents.
    commit_author:
      name: mondspace-reviewer
      email: noreply@github.com
    commit_msg_template: "Bump mondspace-reviewer to {{ .Tag }}"

    hooks:
      post:
        install: |
          # Gatekeeper blocks an unsigned binary that arrived with a quarantine
          # attribute, which is every cask download: macOS reports "Apple could
          # not verify … is free of malware" and offers only Move to Bin.
          #
          # Removing the attribute is the standard remedy for an unsigned
          # open-source CLI, and it is a real trade-off: it skips the
          # notarisation check for this file. The honest fix is a Developer ID
          # signature and notarisation, which needs an Apple developer account —
          # see the release notes.
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/mondspace-reviewer"]
          end
          # The docs call it msr, so brew users should not have to write an alias.
          FileUtils.ln_sf "#{HOMEBREW_PREFIX}/bin/mondspace-reviewer", "#{HOMEBREW_PREFIX}/bin/msr"

    caveats: |
      Installed as both `mondspace-reviewer` and `msr`.

release:
  github:
    owner: mondial7
    name: mondspace-reviewer
