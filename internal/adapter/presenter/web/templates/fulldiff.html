<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .File }} — mondspace-reviewer</title>
  <link rel="stylesheet" href="/assets/app.css">
  <!-- The shell, so this page keeps the theme, the palette and the rail that
       every other page has. -->
  <script type="module" src="/assets/chrome.js" defer></script>
</head>
<body class="page">
  <nav class="sidenav" id="sidenav">
    <a class="storynav__brand" href="/" title="mondspace-reviewer">
      <span class="sidenav__mark" aria-hidden="true">&#9626;</span><span class="sidenav__word">msr</span>
    </a>

    <a class="storynav__link" href="/" title="cockpit"><span class="sidenav__short" aria-hidden="true">co</span><span class="sidenav__word">cockpit</span></a>
    <a class="storynav__link" href="/branches" title="branches"><span class="sidenav__short" aria-hidden="true">br</span><span class="sidenav__word">branches</span></a>
    <a class="storynav__link" href="/search" title="search"><span class="sidenav__short" aria-hidden="true">se</span><span class="sidenav__word">search</span></a>
    <a class="storynav__link" href="/activity" title="activity"><span class="sidenav__short" aria-hidden="true">ac</span><span class="sidenav__word">activity</span></a>
    <a class="storynav__link" href="/settings" title="settings"><span class="sidenav__short" aria-hidden="true">st</span><span class="sidenav__word">settings</span></a>
    <a class="storynav__link" href="/tutorial" title="tour"><span class="sidenav__short" aria-hidden="true">to</span><span class="sidenav__word">tour</span></a>

    <span class="storynav__spacer"></span>
    <button class="sidenav__theme" type="button" data-theme-toggle
            title="Theme">auto</button>
    <!-- The rail itself folds to a strip of two-letter stops. ⌘Z hides it
         altogether, along with the instrument panel on the cockpit. -->
    <button class="sidenav__fold" type="button" data-sidenav-toggle
            aria-controls="sidenav" aria-expanded="true"
            title="Collapse the sidebar">&#8249;</button>
  </nav>

  <div class="shell">

  <header class="masthead">
    <h1 class="masthead__title">{{ .File }}</h1>
    <p class="masthead__meta">
      <span class="masthead__count">the whole diff</span>
      <span class="masthead__hint">
        every line of this change, with nothing left out.
        <a href="{{ .Back }}">Back to the review &rarr;</a>
      </span>
    </p>
  </header>

  <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

  <main class="fulldiff">
    {{ template "diff.html" . }}
  </main>
  </div>
</body>
</html>
