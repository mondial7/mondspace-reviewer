<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .File }} — mondspace-reviewer</title>
  <link rel="stylesheet" href="/assets/app.css">
  <!-- The shell, so this page keeps the theme, the palette and the rail that
       every other page has. -->
  <script type="module" src="/assets/chrome.js" defer></script>
</head>
<body class="page">
  <nav class="storynav">
    <a class="storynav__brand" href="/">msr</a>
    <a class="storynav__link" href="/">cockpit</a>
    <a class="storynav__link" href="/branches">branches</a>
    <a class="storynav__link" href="/search">search</a>
    <a class="storynav__link" href="/activity">activity</a>
    <a class="storynav__link" href="/settings">settings</a>
    <a class="storynav__link" href="/tutorial">tour</a>
  </nav>

  <header class="masthead">
    <h1 class="masthead__title">{{ .File }}</h1>
    <p class="masthead__meta">
      <span class="masthead__count">the whole diff</span>
      <span class="masthead__hint">
        every line of this change, with nothing left out.
        <a href="{{ .Back }}">Back to the review &rarr;</a>
      </span>
    </p>
  </header>

  <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

  <main class="fulldiff">
    {{ template "diff.html" . }}
  </main>
</body>
</html>
